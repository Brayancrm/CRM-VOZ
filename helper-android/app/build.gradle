plugins {
    id 'com.android.application'
}

android {
    namespace 'com.koomind.helper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.koomind.helper'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        debug {
            def projectKeystore = file('../../android/app/debug.keystore')
            def userKeystore = new File(
                    System.getProperty('user.home'),
                    '.android/debug.keystore'
            )
            storeFile projectKeystore.exists() ? projectKeystore : userKeystore
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // APK sideload — assinado (release unsigned falha no Samsung)
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
